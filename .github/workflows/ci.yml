name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege — no job here needs write access to the repo.
permissions:
  contents: read

env:
  # pnpm store cache key base
  PNPM_VERSION: 9.15.4

jobs:
  check:
    name: lint · typecheck · unit · purity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @sin/api exec prisma generate
      # @sin/api consumes @sin/core's built dist (Spec 03.0 — first real
      # consumer), so build it before lint/typecheck/unit, not after. Spec 02 §2
      # AC1 also relies on this proving the library builds + its exports resolve.
      - run: pnpm --filter @sin/core run build
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm run core:purity
      # Spec 03.0 §2 AC5 — re-emit the OpenAPI document from the Zod route
      # schemas and fail if the committed artifact is stale.
      - name: openapi drift check
        run: |
          pnpm --filter @sin/api run openapi:emit
          git diff --exit-code openapi.json
      - name: prisma validate (schema only — never connects)
        run: pnpm --filter @sin/api exec prisma validate
        env:
          # `prisma validate` resolves env("DATABASE_URL") from the datasource
          # block but makes no connection. A placeholder test value satisfies it.
          DATABASE_URL: postgresql://test:test@localhost:5432/test
      - run: pnpm run test:unit

  web:
    name: web (@sin/web — typecheck · test · build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # @sin/web imports @sin/core by package name (MeSchema in useMe.ts); its
      # built `dist` must exist before typecheck / test / vite build — same as
      # the `check` job does for @sin/api (Spec 04.0 §7 / AC16).
      - run: pnpm --filter @sin/core run build
      - run: pnpm --filter @sin/web run typecheck
      # Coverage variant so the Spec 04.0 §10 gates (`src/api/**` +
      # `src/auth/**` >= 90% lines) actually fail the job. Lint for apps/web is
      # covered by the root `pnpm run lint` in the `check` job.
      - run: pnpm --filter @sin/web run test:coverage
      - run: pnpm --filter @sin/web run build
      # AC1 — the built dist is CSP-clean and @sin/core resolved into the bundle.
      - run: node apps/web/scripts/assert-build-output.mjs
      # AC14 — render.yaml ships the strict CSP + security headers.
      - run: node apps/web/scripts/assert-render-yaml.mjs
      # Spec 04.1 AC1 — tokens.css is the only place design values are written;
      # every other stylesheet reads var(--…); no CSS framework dependency.
      - run: node apps/web/scripts/assert-css-tokens.mjs

  integration:
    name: integration (Testcontainers Postgres)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @sin/api exec prisma generate
      # @sin/api imports @sin/core's built dist (Spec 03.0); Vite/Vitest cannot
      # resolve the package without it.
      - run: pnpm --filter @sin/core run build
      - run: pnpm --filter @sin/api run test:integration
        env:
          RUN_INTEGRATION: "1"

  docker:
    name: docker build (criterion 14)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -t si-api:ci .

  smoke:
    name: post-deploy smoke (staging)
    needs: [check, web, integration, docker]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Waits for Render to finish the staging deploy of this SHA, then runs the
      # smoke (Spec 01 §10, criterion 12). Secrets configured in repo settings.
      - run: pnpm --filter @sin/api exec tsx scripts/smoke.ts
        env:
          SMOKE_BASE_URL: ${{ vars.STAGING_BASE_URL }}
          AUTH0_TOKEN_URL: ${{ vars.AUTH0_STAGING_TOKEN_URL }}
          AUTH0_M2M_CLIENT_ID: ${{ secrets.AUTH0_STAGING_M2M_CLIENT_ID }}
          AUTH0_M2M_CLIENT_SECRET: ${{ secrets.AUTH0_STAGING_M2M_CLIENT_SECRET }}
          AUTH0_M2M_AUDIENCE: https://api.strengthinnumbers.app
      # Spec 04.0 AC15/AC17 — the static site serves the CSP + SPA rewrite.
      # Enabled by Spec 06.3 (the site exists; verified 2026-10-04). The repo
      # variable overrides the known staging origin.
      - run: node apps/web/scripts/smoke.mjs
        env:
          WEB_SMOKE_BASE_URL: ${{ vars.STAGING_WEB_BASE_URL || 'https://si-web-staging.onrender.com' }}

  e2e:
    name: M1 browser smoke (staging, Spec 06.3)
    needs: [smoke]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # One Auth0 test user owns one active workout: never run two at once (§6.2).
    concurrency:
      group: e2e-staging
      cancel-in-progress: false
    # The credentials are scoped to the two steps that need them, not the job,
    # so install scripts and apt never see them.
    env:
      E2E_BASE_URL: ${{ vars.STAGING_WEB_BASE_URL || 'https://si-web-staging.onrender.com' }}
      E2E_API_URL: ${{ vars.STAGING_BASE_URL }}
    steps:
      # D10 — until the owner creates the test user and its secrets, skip with
      # a notice instead of turning main red.
      - id: creds
        env:
          E2E_AUTH0_USERNAME: ${{ secrets.E2E_AUTH0_USERNAME }}
          E2E_AUTH0_PASSWORD: ${{ secrets.E2E_AUTH0_PASSWORD }}
        run: |
          if [ -z "$E2E_AUTH0_USERNAME" ] || [ -z "$E2E_AUTH0_PASSWORD" ]; then
            echo "::notice title=e2e skipped::E2E_AUTH0_USERNAME / E2E_AUTH0_PASSWORD are not set — see docs/runbooks/m1-browser-smoke.md"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.creds.outputs.ready == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # wait-for-commit compares the deployed SHA with this one
      - if: steps.creds.outputs.ready == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - if: steps.creds.outputs.ready == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      # §6.3 — don't test the previous bundle: wait for Render to serve this SHA.
      # If a later push is already deployed, this run is superseded and skips.
      - if: steps.creds.outputs.ready == 'true'
        id: wait
        run: node apps/web/scripts/wait-for-commit.mjs
        env:
          WAIT_BASE_URL: ${{ env.E2E_BASE_URL }}
          WAIT_COMMIT: ${{ github.sha }}
      - if: steps.creds.outputs.ready == 'true' && steps.wait.outputs.superseded != 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.creds.outputs.ready == 'true' && steps.wait.outputs.superseded != 'true'
        id: pw-version
        run: echo "version=$(pnpm --filter @sin/web exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - if: steps.creds.outputs.ready == 'true' && steps.wait.outputs.superseded != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw-version.outputs.version }}
      # --with-deps needs apt even on a cache hit; fast when the browser is cached.
      - if: steps.creds.outputs.ready == 'true' && steps.wait.outputs.superseded != 'true'
        run: pnpm --filter @sin/web exec playwright install --with-deps chromium
      - if: steps.creds.outputs.ready == 'true' && steps.wait.outputs.superseded != 'true'
        run: pnpm --filter @sin/web run e2e
        env:
          E2E_AUTH0_USERNAME: ${{ secrets.E2E_AUTH0_USERNAME }}
          E2E_AUTH0_PASSWORD: ${{ secrets.E2E_AUTH0_PASSWORD }}
      # Failure-only screenshots + error context (§7). Never apps/web/e2e/.auth
      # (a live session cookie), no traces (session cookie, typed password) and
      # no HTML report (its step titles include the typed password). The repo is
      # public, so anything here is downloadable by any GitHub user.
      - if: failure() && steps.creds.outputs.ready == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-report
          path: apps/web/test-results/
          retention-days: 3

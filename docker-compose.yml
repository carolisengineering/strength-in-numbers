# Spec 01 §1 (local dev) + criterion 14 — the same image runs here and on Render.

services:
  db:
    # Issue #9 — digest-pinned. Testcontainers reads this line
    # (apps/api/test/integration/postgres-image.ts), so it is the one pin.
    image: postgres:16.15-alpine@sha256:aa6cb33cf4c19c765cefcf48d96176258800870a9a1e930ad126200f9d825139
    environment:
      POSTGRES_USER: sin
      POSTGRES_PASSWORD: sin
      POSTGRES_DB: sin
    ports:
      # Host 5433 to avoid colliding with a native Postgres on 5432.
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sin -d sin"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - db-data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: "3000"
      DATABASE_URL: postgresql://sin_app:sin_app_local@db:5432/sin?sslmode=disable
      AUTH0_ISSUER: https://si-staging.us.auth0.com/
      AUTH0_AUDIENCE: https://api.strengthinnumbers.app
      AUTH0_CLAIM_NAMESPACE: https://strengthinnumbers.app/
      WEB_ORIGIN: http://localhost:5173
      LOG_LEVEL: debug
    command: >
      sh -c "DATABASE_URL=postgresql://sin:sin@db:5432/sin?sslmode=disable pnpm --filter @sin/api exec prisma migrate deploy
      && OWNER_DATABASE_URL=postgresql://sin:sin@db:5432/sin?sslmode=disable APP_ROLE_PASSWORD=sin_app_local node apps/api/dist/db/app-role-cli.js
      && node apps/api/dist/main.js"
    ports:
      - "3000:3000"

volumes:
  db-data:

# Spec 13.0 §6.10 — local Prometheus (pull) + Tempo (OTLP push) + Grafana.
# Separate from docker-compose.yml so the default dev loop is unchanged.
#   docker compose -f docker-compose.observability.yml up -d
# then run the API with OTEL_METRICS_EXPORTER=prometheus and
# OTEL_TRACES_EXPORTER=otlp (see apps/api/.env.example). Grafana: http://localhost:3001
# Images: name:tag@sha256:<multi-arch index digest> (#9) — the image-pins test enforces it.

services:
  prometheus:
    image: prom/prometheus:v3.16.0@sha256:e04987641b57704f408e31f6373ba4138ecf27cb4a165d24aabb6c38fddd0f06
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=2d
      # Spec 16 D18: k6 pushes its load-test metrics here (`-o experimental-prometheus-rw`).
      - --web.enable-remote-write-receiver
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway" # Linux; Docker Desktop provides it already
    ports:
      - "127.0.0.1:9090:9090"

  tempo:
    image: grafana/tempo:3.1.1@sha256:64e2fbd56d9c2b3412a4b430a58ea59e91a670b1e75f920a0c702213ad145044
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./ops/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "127.0.0.1:4318:4318" # OTLP/HTTP in
      - "127.0.0.1:3200:3200" # query API

  grafana:
    image: grafana/grafana:13.3.0@sha256:488984b716c0862639f91a698adbe2862677a5a07bad42da5f03f3030883b205
    depends_on: [prometheus, tempo]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./ops/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./ops/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./ops/grafana/alerts:/etc/grafana/provisioning/alerting:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3001:3000" # compose `api` owns 3000

volumes:
  prometheus-data:
  tempo-data:

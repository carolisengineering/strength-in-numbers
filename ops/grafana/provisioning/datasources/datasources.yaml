apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    jsonData:
      tracesToMetrics:
        datasourceUid: prometheus
        tags: [{ key: "http.route", value: "http_route" }]
        queries:
          - name: Request rate for this route
            query: 'sum(rate(http_server_request_duration_seconds_count{$$__tags}[5m]))'

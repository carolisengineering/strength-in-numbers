# Spec 01 §11 — Render blueprint. Later specs add services/jobs here.

services:
  - type: web
    name: si-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile # build from ./Dockerfile (runtime: image = pull a prebuilt image)
    dockerContext: .
    healthCheckPath: /healthz
    autoDeploy: true # deploy on push to main
    envVars:
      - fromGroup: api-shared
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false # set in the Render dashboard = the Neon connection string

envVarGroups:
  - name: api-shared
    envVars:
      - key: AUTH0_ISSUER
        value: https://si-staging.us.auth0.com/
      - key: AUTH0_AUDIENCE
        value: https://api.strengthinnumbers.app
      - key: AUTH0_CLAIM_NAMESPACE
        value: https://strengthinnumbers.app/
      - key: WEB_ORIGIN
        value: https://si-web-staging.onrender.com
      - key: LOG_LEVEL
        value: info

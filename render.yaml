# Spec 01 §11 — Render blueprint. Later specs add services/jobs here.

services:
  - type: web
    name: si-api
    runtime: docker
    plan: starter
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    # Migrations run as a pre-deploy step, never on app boot (Spec 01 §6.4).
    preDeployCommand: pnpm --filter @sin/api exec prisma migrate deploy
    autoDeploy: true # staging: deploy on push to main; prod promotes the image
    envVars:
      - fromGroup: api-shared
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: si-postgres
          property: connectionString
      # AUTH0_* live in the api-shared group per environment; the prod service
      # overrides the group with the si-prod tenant values in the dashboard.

databases:
  - name: si-postgres
    plan: basic-256mb
    region: oregon
    postgresMajorVersion: "16"

envVarGroups:
  - name: api-shared
    envVars:
      - key: AUTH0_ISSUER
        value: https://si-staging.us.auth0.com/
      - key: AUTH0_AUDIENCE
        value: https://api.strengthinnumbers.app
      - key: AUTH0_CLAIM_NAMESPACE
        value: https://strengthinnumbers.app/
      - key: WEB_ORIGIN
        value: https://si-web-staging.onrender.com
      - key: LOG_LEVEL
        value: info

# Spec 01 §11 — Render blueprint. Later specs add services/jobs here.
# Spec 04.0 §11 — adds the `si-web-staging` static site.

services:
  - type: web
    name: si-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeploy: true # deploy on push to main
    envVars:
      - fromGroup: api-shared
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false # set in the Render dashboard = the Neon connection string

  # Spec 04.0 §11 — the Vite/React SPA (@sin/web) as a Render static site.
  # `@sin/core` is built before `@sin/web` (its `dist` is a runtime import of the
  # bundle — MeSchema in useMe.ts), mirroring the CI `web`/`check` jobs.
  - type: web
    name: si-web-staging
    runtime: static
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @sin/core run build && pnpm --filter @sin/web run build
    staticPublishPath: apps/web/dist
    autoDeploy: true # deploy on push to main
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VITE_APP_ENV
        value: staging
      - key: VITE_AUTH0_DOMAIN
        value: dev-gncuqvfir0wv0t4l.us.auth0.com
      - key: VITE_AUTH0_CLIENT_ID
        sync: false # the SPA app client id — set in the Render dashboard
      - key: VITE_AUTH0_AUDIENCE
        value: https://api.strengthinnumbers.app
      - key: VITE_API_BASE_URL
        value: https://si-api-ft2f.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      # Strict CSP + companion security headers (Spec 04.0 §7 / §8.2, AC14).
      # No blob:, no unsafe-inline, no unsafe-eval anywhere. The Auth0
      # refresh-token worker is self-hosted, so worker-src stays 'self'.
      # `connect-src` = self + the API origin + the Auth0 domain; keep it in
      # sync with the API's WEB_ORIGIN group whenever a hostname changes.
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; connect-src 'self' https://si-api-ft2f.onrender.com https://dev-gncuqvfir0wv0t4l.us.auth0.com; frame-src https://dev-gncuqvfir0wv0t4l.us.auth0.com; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; worker-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; form-action 'self'"
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable

envVarGroups:
  - name: api-shared
    envVars:
      - key: AUTH0_ISSUER
        value: https://dev-gncuqvfir0wv0t4l.us.auth0.com/
      - key: AUTH0_AUDIENCE
        value: https://api.strengthinnumbers.app
      - key: AUTH0_CLAIM_NAMESPACE
        value: https://strengthinnumbers.app/
      - key: WEB_ORIGIN
        value: https://si-web-staging.onrender.com
      - key: LOG_LEVEL
        value: info
